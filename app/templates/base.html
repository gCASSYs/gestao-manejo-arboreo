<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestão de Manejo Arbóreo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success" aria-label="Navegação principal">
      <div class="container gap-3">
        <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">Gestão de Manejo Arbóreo</a>
        <div class="d-flex gap-2 ms-auto">
          <a class="btn btn-outline-light" href="{{ url_for('main.listar_solicitacoes') }}">Consultar</a>
          <a class="btn btn-light" href="{{ url_for('main.nova_solicitacao') }}">Nova solicitação</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div class="alert alert-warning" role="note">Protótipo acadêmico com dados exclusivamente fictícios.</div>
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
