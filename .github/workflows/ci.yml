name: CI

on:
  push:
    branches: [main, "review/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Executar testes e cobertura
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
